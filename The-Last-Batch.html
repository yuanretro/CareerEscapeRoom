window.renderLabScene = function renderLabScene(roomIndex, inspectedIds) {
  const room = Math.max(0, Math.min(5, Number(roomIndex) || 0));

  const titles = ['Staff terminal', 'Cleanroom entrance', 'Materials archive', 'Inspection station', 'Project records', 'Dispatch terminal'];

  const text = (x, y, value, size = 16, color = '#b3c6c2', extra = '') => `<text x="${x}" y="${y}" font-size="${size}" fill="${color}" ${extra}>${value}</text>`;

  const cabinet = (x, y, w, h, content = '') => `<path d="M${x} ${y}l24-14h${w}l-24 14Z" fill="#69817a"/><path d="M${x+w} ${y}l24-14v${h}l-24 14Z" fill="#263e3e"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#${id}-metal)" stroke="#71847c" stroke-width="1.5"/><path d="M${x+8} ${y+h}v9m${w-16}-9v9" stroke="#102224" stroke-width="7"/>${content}`;
  const table = (x, y, w) => `<path d="M${x} ${y}l34-20h${w}l-34 20Z" fill="#a1b4a8"/><path d="M${x} ${y}h${w}v12H${x}Z" fill="#637e75"/><path d="M${x+w} ${y}l34-20v12l-34 20Z" fill="#354f49"/><path d="M${x+15} ${y+12}v70m${w-31}-70v70" stroke="#536d65" stroke-width="9"/><path d="M${x+15} ${y+65}h${w-31}" stroke="#36504a" stroke-width="5"/>`;
  const paper = (x,y,w=86,h=112,stamp=false) => `<path d="M${x} ${y}h${w-15}l15 15v${h-15}H${x}Z" fill="#cfdbcc"/><path d="M${x+w-15} ${y}v15h15" fill="#93b0a6"/><path d="M${x+12} ${y+27}h${w-26}m-${w-26} 12h${w-33}m-${w-33} 12h${w-26}m-${w-26} 12h${w-39}" fill="none" stroke="#607b70" stroke-width="3"/>${stamp ? `<g transform="rotate(-12 ${x+w/2} ${y+h-25})"><rect x="${x+9}" y="${y+h-39}" width="${w-18}" height="23" fill="none" stroke="#987457" stroke-width="2"/>${text(x+w/2,y+h-23,'REVIEW',10,'#806248','text-anchor="middle" letter-spacing="1"')}</g>`:''}`;
  const light = (x,y,w=70) => `<rect x="${x}" y="${y}" width="${w}" height="4" rx="2" fill="#7cdcca"/><rect x="${x-3}" y="${y-3}" width="${w+6}" height="10" rx="5" fill="#7cdcca" opacity=".08"/>`;
  const label = (i,x,y,w) => `<g class="inspection-label"><rect x="${x}" y="${y}" width="${w}" height="42" rx="6" fill="#10282b" stroke="${inspected.has(i)?'#7cdcca':'#637c73'}"/><circle cx="${x+22}" cy="${y+21}" r="11" fill="${inspected.has(i)?'#7cdcca':'#d4bd87'}"/>${inspected.has(i)?`<path d="M${x+17} ${y+21}l3 3 7-7" stroke="#122c2b" fill="none" stroke-width="2.5" stroke-linecap="round"/>`:text(x+22,y+26,i+1,15,'#122c2b','text-anchor="middle" font-weight="700"')}${text(x+42,y+27,labels[i],16,inspected.has(i)?'#b8f0df':'#e8eee5','font-weight="500"')}</g>`;
  const hotspot = (i, art, x, y, w) => `<g class="hotspot${inspected.has(i)?' is-inspected':''}" role="button" tabindex="0" data-inspect="${i}" aria-label="Inspect ${labels[i]}${inspected.has(i)?', already inspected':''}"><title>Inspect ${labels[i]}</title>${art}${label(i,x,y,w)}</g>`;

function freshState(){return {version:VERSION,names:[],startedAt:null,deadline:null,finishedAt:null,finalBossCleared:false,current:0,seen:Array.from({length:6},()=>[]),bossCleared:Array(6).fill(false),solved:Array(6).fill(false),released:Array(6).fill(false),drafts:Array.from({length:6},()=>({})),hints:Array(6).fill(false),coolUntil:Array(6).fill(0),gateUntil:Array(6).fill(0),training:false};}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sameSet(a,b){return Array.isArray(a)&&a.length===b.length&&new Set(a).size===b.length&&b.every(x=>a.includes(x));}
function safeFormURL(v){try{const u=new URL(String(v).trim());return u.protocol==='https:'&&((u.hostname==='docs.google.com'&&/^\/forms\/d\/(?:e\/)?[^/]+\/viewform\/?$/.test(u.pathname))||u.hostname==='forms.gle')?u.href:'';}catch{return '';}}
function readStore(k){try{return localStorage.getItem(k);}catch{return null;}}
function loadState(){try{
 const s=JSON.parse(readStore(SAVE_KEY)||'null');
 if(!s||s.version!==VERSION||!Array.isArray(s.names)||!s.names.length||!s.names.every(n=>typeof n==='string'&&n.trim().length&&n.length<=40))return freshState();
 for(const k of ['seen','bossCleared','solved','released','drafts','hints','coolUntil','gateUntil'])if(!Array.isArray(s[k])||s[k].length!==6)return freshState();
 if(!Number.isFinite(s.startedAt)||s.deadline!==s.startedAt+1500000||!Number.isInteger(s.current)||s.current<0||s.current>5)return freshState();
 if(!s.seen.every(a=>Array.isArray(a)&&a.every(n=>Number.isInteger(n)&&n>=0&&n<3))||!s.drafts.every(d=>d&&typeof d==='object'&&!Array.isArray(d)))return freshState();
 if(!s.bossCleared.every(x=>typeof x==='boolean')||!s.solved.every(x=>typeof x==='boolean')||!s.released.every(x=>typeof x==='boolean')||!s.hints.every(x=>typeof x==='boolean')||!s.coolUntil.every(Number.isFinite)||!s.gateUntil.every(Number.isFinite))return freshState();
 for(let i=0;i<6;i++){if(s.solved[i]&&new Set(s.seen[i]).size!==3)return freshState();if((s.seen[i].length||s.solved[i])&&!s.bossCleared[i])return freshState();if(i&&s.bossCleared[i]&&!s.released[i-1])return freshState();if(s.released[i]&&!s.solved[i])return freshState();if(i&&s.solved[i]&&!s.released[i-1])return freshState();}
 if(s.current>0&&!s.released[s.current-1])return freshState();
 if(s.finalBossCleared===undefined)s.finalBossCleared=!!s.finishedAt;
 if(typeof s.finalBossCleared!=='boolean'||(s.finalBossCleared&&!s.released.every(Boolean)))return freshState();
 if(s.finishedAt!==null&&(!s.finalBossCleared||!Number.isFinite(s.finishedAt)||!s.released.every(Boolean)||s.finishedAt<s.startedAt))return freshState();
 s.seen=s.seen.map(a=>[...new Set(a)]);s.training=!!s.training;return s;
 }catch{return freshState();}}

function announce(t){document.getElementById('announcer').textContent=t;}

function fmt(sec){const n=Math.max(0,Math.floor(sec));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}

function clockText(){if(!state.startedAt)return '25:00';const t=state.finishedAt||Date.now(),left=Math.ceil((state.deadline-t)/1000);return left>=0?fmt(left):state.training?'+'+fmt(-left):'00:00';}

function header(playing=true){return `<header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">N</div><div><b>THE LAST BATCH</b><small>NOVA SEMICONDUCTOR · 2038</small></div></div>${playing?`<nav class="room-nav" aria-label="Rooms">${ROOMS.map((r,i)=>`<button data-room="${i}" class="${state.current===i?'active ':''}${state.released[i]?'done':''}" aria-label="Room ${i+1}: ${r.name}${!canVisit(i)?', locked':''}" ${canVisit(i)?'':'disabled'}>${state.released[i]?'✓':i+1}</button>`).join('')}</nav>`:''}<div class="top-actions">${playing?`<button class="text-btn" data-action="notebook">Notebook</button>${formURL?'<button class="text-btn form-link" data-action="open-form">Form ↗</button>':''}<button class="text-btn" data-action="menu">Menu</button><button class="text-btn" id="training-btn" data-action="training" ${expired()&&!state.training?'':'hidden'}>Continue training</button><span id="clock" class="clock">${clockText()}</span>`:'<button class="text-btn" data-action="howto">How to play</button>'}<button class="text-btn" data-action="fullscreen" aria-label="Toggle fullscreen">⛶</button></div></header><small class="creator-credit">Made by Haolun, William, and Gordan</small>`;}
function render(){window.stopRover?.();
 if(view==='landing'){renderLanding();return;}
 if(view==='ending'){if(state.finalBossCleared&&state.finishedAt)renderEnding();else{view=state.released.every(Boolean)?'final-boss':'gate';render();}return;}
 if(view==='final-boss'){if(state.released.every(Boolean))renderFinalBoss();else{view='floor';render();}return;}
 if(!state.startedAt||!canVisit(state.current)){view='landing';renderLanding();return;}
 if(view==='puzzle'&&(!state.bossCleared[state.current]||state.seen[state.current].length<3))view='floor';
 if(view==='gate'&&!state.solved[state.current])view='floor';
 if(view==='floor')renderFloor();else if(view==='puzzle')renderPuzzle();else if(view==='gate')renderGate();
 tick();
}
function renderLanding(){app.innerHTML=header(false)+`<main id="main" class="screen landing" tabindex="-1"><div class="landing-copy"><div class="eyebrow">Micro Electronics Manufacturer / Escape game</div><h1>The last<br><em>batch.</em></h1><p>Take the role of a Micro Electronics Manufacturer. Explore the lab, inspect parts and complete the records before the last batch can move on.</p><div class="mission-tags"><span>6 ROOMS</span><span>25 MINUTES</span><span>SOLO OR TOGETHER</span></div><p class="small">Everything you need is in the clue cards. No advanced chipmaking knowledge required.</p></div><div class="hero-art">${window.renderLabScene(3,[]).replace(/tabindex="0"/g,'tabindex="-1"').replace(/role="button"/g,'role="img"').replace(/data-inspect="[0-2]"/g,'')}<div class="hero-caption">Explore → solve → enter the Form code → bring back the door code.</div></div><div class="landing-bottom">${state.startedAt?`<div class="resume-card"><b>Your mission is saved.</b><p>${esc(state.names.join(', '))} · ${state.released.filter(Boolean).length}/6 checkpoints unlocked</p><div class="gate-actions"><button class="btn" data-action="resume">${state.finishedAt?'View result':'Resume mission'} →</button><button class="btn secondary" data-action="restart">Start fresh</button></div></div>`:`<form id="start-form" class="signup"><label for="names">Player name(s)</label><div class="input-row"><input class="input" id="names" maxlength="600" autocomplete="off" placeholder="Your name, or names separated by commas" aria-describedby="name-error"><button class="btn" type="submit">Start mission →</button></div><p class="form-note">Play alone or with others. Progress saves in this browser.</p><p id="name-error" class="inline-error" role="alert"></p></form>`}<div class="instructions-strip"><div><b>EXPLORE</b>Beat each challenge, navigate the maze, collect three reports.</div><div><b>UNLOCK</b>The game and Google Form exchange different codes.</div></div></div></main>`;document.getElementById('start-form')?.addEventListener('submit',startMission);}
function startMission(e){e.preventDefault();if(state.startedAt)return;const names=document.getElementById('names').value.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);if(!names.length||names.some(n=>n.length>40)){document.getElementById('name-error').textContent='Enter at least one name. Keep each name under 41 characters.';return;}state=freshState();state.names=names;state.startedAt=Date.now();state.deadline=state.startedAt+1500000;view='floor';feedback='';window.resetRover?.();save();render();focusGame();}
function recordButton(r,k){const read=state.seen[r].includes(k);return `<button class="record-btn ${read?'seen':''}" data-evidence="${r},${k}" ${read?'':'disabled'}><span class="number">${read?'✓':k+1}</span><span>${ROOMS[r].evidence[k].title}</span></button>`;}
function reportStatus(i,k){const read=state.seen[i].includes(k);return `<div class="record-btn report-status ${read?'seen':''}" aria-label="Report ${k+1}: ${read?'collected':'not collected'}"><span class="number">${read?'✓':k+1}</span><span>${ROOMS[i].evidence[k].title}<small>${read?'Saved in notebook':'Collect in the maze'}</small></span></div>`;}
function defeatedBoss(i){if(view!=='floor'||i!==state.current||!canVisit(i)||state.bossCleared[i])return;state.bossCleared[i]=true;save();render();focusGame();announce('Challenge complete. Explore the maze and collect all three reports.');}
function renderFloor(){const i=state.current,r=ROOMS[i],cleared=state.bossCleared[i];
const kinds=[null,'stacker',null,'memory','timing','breaker'];
const controls=cleared?'WASD / arrows · E to collect · P to pause rover':[
'WASD / arrows · Space to fire · P to pause',
'A/D or arrows: move · W / Up: rotate · Space: drop · P: pause',
'WASD / arrows · dodge three waves · P to pause',

'Space / Enter or click LOCK · P to pause',

function opts(items,current){return '<option value="">Choose…</option>'+items.map(([v,t])=>`<option value="${v}" ${v===current?'selected':''}>${t}</option>`).join('');}
function sampleArt(i){return `<svg viewBox="0 0 180 95" aria-hidden="true"><ellipse cx="90" cy="76" rx="64" ry="7" fill="#061217"/><rect x="${i===1?13:35}" y="28" width="${i===1?150:108}" height="30" rx="8" fill="#71a39e" stroke="#b8dcc9" stroke-width="2"/><ellipse cx="${i===1?162:143}" cy="43" rx="6" ry="15" fill="#244647" stroke="#bbdccc"/>${i===0?'<path d="m80 28-7 9 11 5-6 16" fill="none" stroke="#ffb4a5" stroke-width="4"/>':''}<text x="90" y="91" fill="#acc8b7" font-size="13" font-family="monospace" text-anchor="middle">${i===1?'7 cm':'5 cm'}</text></svg>`;}
function puzzleContent(i){const d=state.drafts[i];
 if(i===0)return `<div class="match-grid">${[['cpu','CPU / processor','01'],['memory','Memory','02'],['sensor','Sensor','03']].map(([id,label,n])=>`<div class="match-item"><div class="match-icon" aria-hidden="true">${n}</div><label for="${id}">${label}</label><select id="${id}" data-field="${id}">${opts([['detect','Detects light or temperature'],['instructions','Follows instructions'],['data','Stores data']],d[id])}</select></div>`).join('')}</div>`;

 if(i===2)return `<div class="process-layout"><div class="process-bank">${PROCESS.map(p=>`<button class="process-card" data-process="${p.id}" ${(d.seq||[]).includes(p.id)?'disabled':''}>+ ${p.label}</button>`).join('')}</div><div class="process-order"><div class="eyebrow">Your order</div><ol>${(d.seq||[]).map(id=>`<li>${PROCESS.find(p=>p.id===id)?.label||''}</li>`).join('')}</ol><div class="minor-actions"><button class="text-btn" data-action="undo" ${d.seq?.length?'':'disabled'}>Undo</button><button class="text-btn" data-action="clear-order" ${d.seq?.length?'':'disabled'}>Clear</button></div></div></div>`;
 if(i===3)return `<div class="sample-grid">${['A','B','C'].map((s,k)=>`<div class="sample-card"><h3>Sample ${s}</h3>${sampleArt(k)}<p>${k===0?'Has a crack':'No cracks'} · ${k===1?'7 cm':'5 cm'}</p><label class="sr-only" for="sample-${s}">Sample ${s} result</label><select id="sample-${s}" data-field="sample${s}">${opts([['pass','Pass'],['fail','Fail']],d['sample'+s])}</select></div>`).join('')}</div>`;
 if(i===4)return `<div class="simple-form"><div><label for="reason">Why did 30 chips fail inspection?</label><select id="reason" data-field="reason">${opts([['size','The chips were the wrong size'],['cracked','Their cases were cracked'],['untested','They had not been tested']],d.reason)}</select></div><div><label for="amount">Number of chips that passed</label><div class="math-line">80 − 30 = ?</div><input class="input" id="amount" data-field="amount" type="number" min="0" step="1" inputmode="numeric" placeholder="Enter a number" value="${esc(d.amount||'')}"></div></div>`;
 return `<div class="simple-form"><div><label for="batch">Which batch holds the 50 passing chips?</label><select id="batch" data-field="batch">${opts([['B302','B-302'],['B304','B-304'],['B306','B-306']],d.batch)}</select></div><div><label for="station">What is its next station?</label><select id="station" data-field="station">${opts([['office','Office'],['pack4','Packaging, Station 4'],['hold2','Hold area, Station 2']],d.station)}</select></div></div>`;
}
function renderPuzzle(){const i=state.current,r=ROOMS[i];app.innerHTML=header()+`<main id="main" class="screen puzzle-screen" tabindex="-1"><div class="puzzle-heading"><div><div class="eyebrow">Room ${i+1} / ${r.short}</div><h1>${r.verb}</h1></div><button class="text-btn" data-action="back-floor">← Back to lab</button></div><div class="puzzle-layout"><aside class="clue-panel"><h3>Your clue cards</h3>${r.evidence.map((_,k)=>recordButton(i,k)).join('')}<p class="hint-text">${state.hints[i]?r.hint:'Everything needed is in these cards. Open them again whenever you want.'}</p><button class="text-btn hint-btn" data-action="hint" ${state.hints[i]?'disabled':''}>Earn hint · 10s</button></aside><section class="puzzle-main" aria-label="Room puzzle"><p class="question">${r.question}</p><div class="puzzle-content">${puzzleContent(i)}</div></section></div><div class="puzzle-footer"><div class="feedback ${feedbackError?'error':''}" id="feedback" role="status">${esc(feedback||'Use the clues. Check your answer before submitting.')}</div><button class="btn" id="puzzle-submit" data-action="submit">Check answer →</button></div></main>`;}
function evaluateRoom(i,d){const incomplete=text=>({ok:false,incomplete:true,text}),fail=text=>({ok:false,text});
 if(i===0){if(!d.cpu||!d.memory||!d.sensor)return incomplete('Choose a job for all three parts.');return d.cpu==='instructions'&&d.memory==='data'&&d.sensor==='detect'?{ok:true}:fail('Not quite. Reopen the clue card for each part and match its job.');}
 if(i===1){if(!d.flags?.length)return incomplete('Select the unsafe situations.');return sameSet(d.flags,['drink','hair','cardboard','hand'])?{ok:true}:fail('Check for drinks, uncovered hair, cardboard and bare-hand contact.');}
 if(i===2){if(d.seq?.length!==4)return incomplete('Place all four cards.');return d.seq.join(',')==='prepare,build,test,package'?{ok:true}:fail('Start by preparing the wafer. Build before testing, and package last.');}
 if(i===3){if(!d.sampleA||!d.sampleB||!d.sampleC)return incomplete('Mark all three samples Pass or Fail.');return d.sampleA==='fail'&&d.sampleB==='fail'&&d.sampleC==='pass'?{ok:true}:fail('A sample needs no cracks AND a size of 5 cm. Check both rules.');}
 if(i===4){if(!d.reason||String(d.amount??'').trim()==='')return incomplete('Choose the defect and enter how many chips passed.');return d.reason==='cracked'&&Number(d.amount)===50?{ok:true}:fail('Thirty chips had cracked cases. Subtract 30 failed chips from 80 tested.');}
 if(i===5){if(!d.batch||!d.station)return incomplete('Choose a batch and its next station.');return d.batch==='B304'&&d.station==='pack4'?{ok:true}:fail('Find the 50 passing chips in the tracking log, then read the work order.');}
 return fail('This room is unavailable.');
}
function ensureTime(){if(expired()&&!state.training){toast('Time is up. Select Continue training at the top to finish.');return false;}return true;}
function submitRoom(){const i=state.current;if(view!=='puzzle'||!canVisit(i)||!state.bossCleared[i]||state.seen[i].length!==3||state.solved[i]||Date.now()<state.coolUntil[i]||!ensureTime())return;const result=evaluateRoom(i,state.drafts[i]);if(result.ok){state.solved[i]=true;view='gate';feedback='';save();render();announce('Puzzle solved. Enter the room code in Google Forms.');}else{feedback=result.text;feedbackError=true;if(!result.incomplete)state.coolUntil[i]=Date.now()+5000;save();render();announce(result.text);}}
function renderGate(){const i=state.current,r=ROOMS[i];app.innerHTML=header()+`<main id="main" class="screen gate-screen" tabindex="-1"><div class="gate-heading"><div class="eyebrow">Room ${i+1} / puzzle solved</div><h1>${state.released[i]?'Checkpoint unlocked.':'The door needs two codes.'}</h1></div><div class="gate-layout"><section class="gate-card"><div class="step-label"><span>1</span>Game → Google Form</div><p>Enter this code in <strong>Room ${i+1}</strong> of your Google Form, then click <strong>${i===5?'Submit':'Next'}</strong>.</p><div class="room-code" tabindex="0">${r.code}</div><div class="gate-actions"><button class="btn secondary" data-copy="${i}">Copy code</button>${formURL?'<button class="btn secondary" data-action="open-form">Open Form ↗</button>':''}</div><p class="gate-help">${r.reward}</p></section><section class="gate-card"><div class="step-label"><span>2</span>Google Form → Game</div>${state.released[i]?`<p class="receipt-success">Return code accepted. This checkpoint stays unlocked.</p><button class="btn" data-next="${i}">${i===5?(state.finalBossCleared?'View result':'Enter final battle'):'Enter Room '+(i+2)} →</button>`:`<p>${i===5?'The Form’s confirmation message':'The next Form section'} gives you a <strong>different code</strong>. Enter that return code here.</p><form class="gate-form" id="gate-form"><label for="return-code">${i===5?'Final confirmation code':'Door code from the Form'}</label><input class="input" id="return-code" autocomplete="off" spellcheck="false" autocapitalize="characters" maxlength="24" placeholder="Code from Google Forms" aria-describedby="gate-feedback"><button class="btn" id="unlock-submit" type="submit">${i===5?'Enter final battle':'Unlock Room '+(i+2)} →</button></form><p class="feedback ${feedbackError?'error':''}" id="gate-feedback" role="status">${esc(feedback||'The code above goes into the Form. It will not open this door.')}</p>`}<p class="gate-help">Keep the same Form tab open throughout the game. Uppercase or lowercase is fine for the return code.</p><button class="text-btn" data-action="back-floor">← Back to lab</button></section></div></main>`;document.getElementById('gate-form')?.addEventListener('submit',e=>{e.preventDefault();unlockGate(document.getElementById('return-code').value);});}
function unlockGate(value){const i=state.current;if(view!=='gate'||!canVisit(i)||!state.bossCleared[i]||!state.solved[i]||state.released[i]||Date.now()<state.gateUntil[i]||!ensureTime())return false;const answer=String(value).trim().toUpperCase();if(!answer){setGateError('Enter the return code shown by the Form.');return false;}if(answer!==RETURN_CODES[i]){state.gateUntil[i]=Date.now()+5000;save();setGateError('That does not open this door. Copy the new code from the Form after Next or Submit.');return false;}state.released[i]=true;feedback='';feedbackError=false;if(i===5){view='final-boss';}else{state.current=i+1;view='floor';}save();render();focusGame();announce(i===5?'Final code accepted. Defeat the Nova Core.':'Room '+(i+2)+' unlocked.');return true;}
function setGateError(text){feedback=text;feedbackError=true;const el=document.getElementById('gate-feedback');if(el){el.textContent=text;el.className='feedback error';}announce(text);tick();}
function nextRoom(i){if(!canProceed(i))return false;closeModal();if(i===5)view=state.finalBossCleared?'ending':'final-boss';else{state.current=i+1;view='floor';}feedback='';save();render();focusGame();return true;}
function finishFinalBoss(){if(view!=='final-boss'||!state.released.every(Boolean)||state.finalBossCleared)return;state.finalBossCleared=true;state.finishedAt=Date.now();if(state.finishedAt>state.deadline)state.training=true;view='ending';save();render();focusGame();announce('Nova Core defeated. Mission complete.');}
function renderFinalBoss(){app.innerHTML=header()+`<main id="main" class="screen floor-screen" tabindex="-1"><div class="room-heading"><h1>Final encounter / Nova Core</h1><p>BATCH-SAVED accepted · break all three seals</p></div><div class="map-frame"><canvas id="rover" width="1000" height="460" tabindex="0" role="img" aria-label="Final boss. Move with WASD, arrows or clicks inside the box. Dodge each wave, then press Space or click the exposed core. Break three seals."></canvas></div><div class="final-brief"><strong>One last override.</strong><span>Dodge the pulse waves. When the core opens, press Space or click it. Break all three seals.</span></div><div class="floor-controls"><span>WASD / arrows or click to move · Space to strike · P to pause · R to retry</span><span>Your six Form checkpoints are saved.</span></div></main>`;window.startNovaEncounter(document.getElementById('rover'),'final',finishFinalBoss);tick();}
function earnHint(){const i=state.current;if(view!=='puzzle'||!canVisit(i)||!state.bossCleared[i]||state.seen[i].length!==3||state.hints[i])return;showModal('Unlock the hint','<p>Catch <strong>5 lit signals in 10 seconds</strong>. Click the lit tile or press its number. Hit a tile to begin.</p><canvas id="signal-game" width="680" height="240" tabindex="0" aria-label="Signal lock. Press the lit number from 1 to 9. Collect five signals in ten seconds."></canvas>');window.startSignalGame(document.getElementById('signal-game'),i,()=>{if(view!=='puzzle'||state.current!==i||!modal.open)return;state.hints[i]=true;save();closeModal();render();focusGame();announce('Hint unlocked. Read it beside your clue cards.');});}
function renderEnding(){const elapsed=fmt(((state.finishedAt||Date.now())-state.startedAt)/1000),onTime=state.finishedAt<=state.deadline;app.innerHTML=header()+`<main id="main" class="screen ending" tabindex="-1"><div><div class="eyebrow">${onTime?'MISSION COMPLETE':'TRAINING COMPLETE / OVERTIME'}</div><h1>Batch checked.<br>Ready to move.</h1><p>You followed the process, protected the cleanroom, checked parts and recorded the final batch.</p><div class="end-stats"><div><strong>${elapsed}</strong><span>Total mission time</span></div><div><strong>6 / 6</strong><span>Form checkpoints unlocked</span></div></div><p class="small">Nova Core defeated. Your teacher can check the submitted response in Google Forms.</p><div class="end-actions"><button class="btn" data-action="notebook">Review notebook</button><button class="btn secondary" data-action="restart">Play again</button></div></div><div class="dispatch-card"><div class="eyebrow">Product tracking record</div><h2>Batch B-304</h2><div class="dispatch-row"><span>Test results</span><b>50 passing chips</b></div><div class="dispatch-row"><span>Next station</span><b>Packaging · Station 4</b></div><div class="dispatch-row"><span>Status</span><b>Passing chips ready</b></div><div class="dispatch-row"><span>Career takeaway</span><b>Check. Test. Record.</b></div><p class="small muted" style="margin-top:22px">This trade combines operating equipment, inspecting products and keeping accurate records.</p></div></main>`;tick();}
function focusGame(){requestAnimationFrame(()=>{const target=(view==='floor'||view==='final-boss')?document.getElementById('rover'):document.getElementById('main');target?.focus({preventScroll:true});});}
function showModal(title,body,footer='',tag='NOVA / FIELD NOTES'){window.stopSignalGame?.();if(!modal.open)returnFocus=document.activeElement;modal.innerHTML=`<div class="modal-inner"><div class="modal-head"><div><div class="eyebrow">${tag}</div><h2 id="modal-title">${title}</h2></div><button class="modal-close" data-action="close-modal" aria-label="Close dialog">×</button></div><div class="modal-body">${body}</div><div class="modal-footer">${footer||'<span></span><button class="btn" data-action="close-modal">Back to game</button>'}</div></div>`;if(!modal.open)modal.showModal();modal.querySelector('button')?.focus();}
function closeModal(){window.stopSignalGame?.();if(modal.open)modal.close();if(view==='floor')focusGame();else if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});}
modal.addEventListener('cancel',()=>{window.stopSignalGame?.();});
modal.addEventListener('cancel',()=>requestAnimationFrame(()=>{if(view==='floor')focusGame();else returnFocus?.isConnected&&returnFocus.focus({preventScroll:true});}));
function openEvidence(i,k){if(view==='landing'||!canVisit(i)||!Number.isInteger(k)||k<0||k>2)return;if(!state.seen[i].includes(k)){if(view!=='floor'||i!==state.current||!state.bossCleared[i]||!window.roverCanInspect?.(i,k))return;state.seen[i].push(k);save();render();}const ev=ROOMS[i].evidence[k];showModal(ev.title,ev.text,`<button class="btn secondary" data-notebook="${i}">Notebook</button><button class="btn" data-action="close-modal">Got it ✓</button>`,`ROOM ${i+1} / CLUE ${k+1} OF 3`);}
function notebook(i=state.current){notebookRoom=i;const r=ROOMS[i];showModal('Evidence notebook',`<div class="notebook-tabs" aria-label="Notebook rooms">${ROOMS.map((_,k)=>`<button data-notebook="${k}" class="${k===i?'active':''}" ${canVisit(k)?'':'disabled'}>Room ${k+1}</button>`).join('')}</div><h3>${r.name}</h3><div class="notebook-records">${r.evidence.map((_,k)=>state.seen[i].includes(k)?recordButton(i,k):'<div class="record-btn muted">Clue not found</div>').join('')}</div><p class="notebook-finding">${state.solved[i]?r.reward:'Explore the room and solve its puzzle to add a finding.'}</p>${state.solved[i]?`<div class="notebook-code">Form code: ${r.code} <button class="text-btn" data-copy="${i}">Copy</button></div>`:''}`,undefined,'YOUR COLLECTED CLUES');}
function howto(page=0){const pages=[['Explore and solve','<p><strong>1. Beat the room challenge.</strong> Each room is different: shooter, falling blocks, dodge box, memory, timing and brick breaker. Follow the controls shown in the arena. P pauses a challenge; click or press P to resume.</p><p><strong>2. Explore and solve.</strong> Navigate the maze. Press E beside each numbered terminal to collect its report. Read all three, then open the puzzle. Earn a hint through a 10-second signal game if stuck.</p><p>The arcade challenges and mazes are fictional. Use the reports to answer the career questions.</p>'],['Exchange the codes','<p><strong>3. Game → Form.</strong> Solve a room to reveal its NOVA code. Enter that in the matching Form section and click Next.</p><p><strong>4. Form → Game.</strong> The next Form section shows a new door code. Enter it in the game to unlock the next room.</p><p>After Room 6, submit the Form. Its confirmation message gives BATCH-SAVED. Enter it to unlock the final boss. Keep the same Form tab open.</p>'],['Controls and saving','<p>Play alone or with others. Completed challenges and collected reports save in this browser. Names are entered separately in Google Forms.</p><p>Tab moves between controls. Enter selects. Escape closes notes. Click clear nearby floor to drive; clicks cannot route through walls. Your notebook reopens reports you have collected.</p><p>The 25-minute clock continues while reading or visiting the Form. At zero, choose Continue training to finish. P pauses only the action, not the mission clock.</p>']];showModal(pages[page][0],pages[page][1],`<span class="small muted">${page+1} / 3</span><div class="gate-actions">${page?`<button class="btn secondary" data-help="${page-1}">← Back</button>`:''}${page<2?`<button class="btn" data-help="${page+1}">Next →</button>`:'<button class="btn" data-action="close-modal">Ready</button>'}</div>`,'HOW TO PLAY');}
function sources(){showModal('Career sources',`<div class="source-list">${SOURCES.map(([org,title,url])=>`<div><a href="${url}" target="_blank" rel="noopener noreferrer">${org} ↗</a><small>${title}</small></div>`).join('')}</div><p class="small muted" style="margin-top:18px">The lab, batches, counts and sample rules are fictional training examples. The career information is based on these sources.</p>`);}
function menu(){showModal('Mission menu',`<div class="menu-grid"><button class="btn secondary" data-action="howto">How to play</button><button class="btn secondary" data-action="sources">Career sources</button><button class="btn secondary" data-action="notebook">Notebook</button><button class="btn secondary" data-action="restart">Start a new game</button></div><p class="small muted" style="margin-top:24px">The clock keeps running in menus and in the Form. Your current progress is saved.</p>`);}
function restartPrompt(){showModal('Start fresh?',`<p>This starts a new mission and clears this version’s saved progress in this browser.</p><p>Your submitted Google Form responses are not changed.</p>`,`<button class="btn secondary" data-action="close-modal">Cancel</button><button class="btn danger" data-action="confirm-restart">Start fresh</button>`);}
function openForm(){if(!formURL){toast('Open the Google Form provided for this game in another tab.');return;}if(formWindow&&!formWindow.closed){formWindow.focus();return;}if(formOpened){showModal('Your Google Form',`<p>Use the Form tab you already opened to keep your response. If you closed it, use this link.</p><a class="btn" href="${esc(formURL)}" target="_blank" rel="noopener noreferrer">Reopen Form ↗</a>`);return;}const w=window.open('about:blank','_blank');if(w){w.opener=null;w.location.replace(formURL);formWindow=w;formOpened=true;}else showModal('Open your Form',`<p>Your browser blocked the new tab.</p><a class="btn" href="${esc(formURL)}" target="_blank" rel="noopener noreferrer">Open Google Form ↗</a>`);}
async function copyCode(i){if(!state.solved[i])return;try{await navigator.clipboard.writeText(ROOMS[i].code);toast('Copied '+ROOMS[i].code);}catch{showModal('Copy your code',`<p>Select the code and copy it with Ctrl+C or your device’s Copy command.</p><input class="input" id="manual-copy" readonly aria-label="Room code" value="${ROOMS[i].code}">`);document.getElementById('manual-copy').select();}}
function updatePuzzle(selector){render();if(selector)document.querySelector(selector)?.focus({preventScroll:true});}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.evidence){const [i,k]=b.dataset.evidence.split(',').map(Number);openEvidence(i,k);return;}
 if(b.hasAttribute('data-notebook')){const i=Number(b.dataset.notebook);if(canVisit(i))notebook(i);return;}
 if(b.hasAttribute('data-room')){const i=Number(b.dataset.room);if(canVisit(i)){state.current=i;view=state.solved[i]?'gate':'floor';feedback='';save();render();focusGame();}return;}
 if(b.hasAttribute('data-copy')){copyCode(Number(b.dataset.copy));return;}
 if(b.hasAttribute('data-next')){nextRoom(Number(b.dataset.next));return;}
 if(b.hasAttribute('data-help')){howto(Number(b.dataset.help));return;}
 const i=state.current,d=state.drafts[i];
 if(b.dataset.hazard&&view==='puzzle'&&!state.solved[i]){d.flags=d.flags||[];const k=d.flags.indexOf(b.dataset.hazard);if(k<0)d.flags.push(b.dataset.hazard);else d.flags.splice(k,1);save();updatePuzzle(`[data-hazard="${b.dataset.hazard}"]`);return;}
 if(b.dataset.process&&view==='puzzle'&&!state.solved[i]){d.seq=d.seq||[];if(!d.seq.includes(b.dataset.process))d.seq.push(b.dataset.process);save();updatePuzzle();document.querySelector('.process-card:not(:disabled)')?.focus({preventScroll:true});return;}
 switch(b.dataset.action){
  case 'resume':view=state.finishedAt?'ending':state.released.every(Boolean)?'final-boss':state.solved[i]?'gate':'floor';render();focusGame();break;
  case 'open-puzzle':if(state.bossCleared[i]&&state.seen[i].length===3){view=state.solved[i]?'gate':'puzzle';feedback='';render();focusGame();}break;
  case 'back-floor':view='floor';render();focusGame();break;
  case 'submit':submitRoom();break;
  case 'notebook':notebook();break;
  case 'hint':earnHint();break;
  case 'undo':d.seq?.pop();save();updatePuzzle();break;
  case 'clear-order':d.seq=[];save();updatePuzzle();break;
  case 'close-modal':closeModal();break;
  case 'howto':howto();break;
  case 'sources':sources();break;
  case 'menu':menu();break;
  case 'restart':restartPrompt();break;
  case 'open-form':openForm();break;
  case 'training':state.training=true;save();tick();toast('Training mode enabled. Your final time will include overtime.');break;
  case 'fullscreen':{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();p?.catch(()=>toast('Use your browser’s fullscreen control instead.'));break;}
  case 'confirm-restart':closeModal();window.resetRover?.();state=freshState();view='landing';feedback='';try{localStorage.removeItem(SAVE_KEY);}catch{}render();document.getElementById('names')?.focus();break;
 }
});
function recordField(e){const el=e.target;if(view!=='puzzle'||state.solved[state.current]||!el.dataset.field)return;state.drafts[state.current][el.dataset.field]=el.value;save();}
document.addEventListener('input',recordField);document.addEventListener('change',recordField);
function tick(){const t=state.finishedAt||Date.now(),left=(state.deadline-t)/1000;const clock=document.getElementById('clock');if(clock){clock.textContent=clockText();clock.classList.toggle('low',left>0&&left<300);clock.classList.toggle('expired',left<=0);clock.setAttribute('aria-label',state.finishedAt?'Time saved at completion: '+clockText():'Mission clock: '+clockText());}const training=document.getElementById('training-btn');if(training)training.hidden=!(expired()&&!state.training);const i=state.current;
 const wait=Math.max(0,Math.ceil((state.coolUntil[i]-Date.now())/1000));const quiz=document.getElementById('puzzle-submit');if(quiz){quiz.disabled=wait>0;quiz.textContent=wait?`Review clues · ${wait}s`:'Check answer →';}
 const gateWait=Math.max(0,Math.ceil((state.gateUntil[i]-Date.now())/1000));const gate=document.getElementById('unlock-submit');if(gate){gate.disabled=gateWait>0;gate.textContent=gateWait?`Check the Form · ${gateWait}s`:i===5?'Complete mission →':'Unlock Room '+(i+2)+' →';}}
document.addEventListener('visibilitychange',tick);setInterval(tick,250);render();

function cameraArt(kind){
 const base='<path d="M8 74H172M18 77v8m144-8v8" stroke="#53776a" stroke-width="2"/><path d="M10 22H170M28 12V72M155 12V72" stroke="#2a4e46"/>';
 let art='';
 if(kind==='carrier')art='<path d="M42 38l55-10 38 13v31H42Z" fill="#315d52" stroke="#86c8b4"/><path d="M42 38h93l-7-8H50Z" fill="#759991"/><path d="M85 39v31" stroke="#8db7a9"/><rect x="71" y="49" width="34" height="14" rx="2" fill="#142e27"/><path d="m82 55 4 4 8-8" fill="none" stroke="#9bdac1" stroke-width="2"/>';
 if(kind==='drink')art='<ellipse cx="55" cy="65" rx="24" ry="7" fill="#7fa2ac"/><path d="M96 35h30l-3 36h-24Z" fill="#c99f6f"/><path d="M127 43q18-2 11 16h-14" fill="none" stroke="#c99f6f" stroke-width="5"/><ellipse cx="111" cy="35" rx="15" ry="4" fill="#5c412a"/><path d="M108 31q-8-10 0-17m11 15q-8-8 0-14" stroke="#a2c3ad" fill="none"/>';
 if(kind==='hair'||kind==='gown')art=`<path d="M65 45q-18 8-19 27h88q-2-22-21-27" fill="#7b9e97"/><path d="M65 49V27q22-22 45 0v25" fill="#a7beb0" stroke="#d4e0d1"/><rect x="72" y="30" width="32" height="23" rx="8" fill="#ccb193"/><path d="M71 43h34v15H73Z" fill="#536f72"/>${kind==='hair'?'<path d="M72 21q-16-6-16 17l-2 19m11-32q-11 0-11 21" fill="none" stroke="#b48b53" stroke-width="5"/><path d="M112 23q16 4 10 27" stroke="#b48b53" stroke-width="4" fill="none"/>':'<path d="M47 62h14v10H46m73-10h14v10h-14" fill="#d4e0d1"/><path d="M65 27q25-23 45 0" fill="none" stroke="#d7e4d3" stroke-width="4"/>'}`;
 if(kind==='cardboard')art='<path d="M54 42l39-12 37 13-38 13Z" fill="#b79765"/><path d="M54 42v29l38 9V56Z" fill="#967244"/><path d="M92 56v24l38-13V43Z" fill="#715838"/><path d="m74 36 37 14v23" stroke="#c8af7c" stroke-width="8"/><ellipse cx="147" cy="70" rx="19" ry="5" fill="#83a5aa"/>';
 if(kind==='hand')art='<ellipse cx="85" cy="64" rx="43" ry="11" fill="#648c94" stroke="#a7c0bf"/><path d="M50 64h70m-53-7 7 14m6-17 8 21m5-19 8 16" stroke="#34525b"/><path d="m126 15-11 25-32 17q-4 9 4 10l34-14 19-31" fill="#caaa8b" stroke="#ead3b1" stroke-width="2"/><path d="m119 41 8 6" stroke="#9d755a"/>';
 return `<svg viewBox="0 0 180 90" aria-hidden="true">${base}${art}<text x="11" y="14" fill="#88bda8" font-size="7" font-family="monospace">CAM // 02</text><circle cx="165" cy="12" r="2" fill="#86d9b9"/></svg>`;
}

</script></body></html>
